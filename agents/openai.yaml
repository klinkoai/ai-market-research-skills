interface:
  display_name: "Klinko Market Research"
  short_description: "Run evidence-led AI market research decisions"
  default_prompt: "Use $klinko-market-research to apply the right research skill and answer my market question with Klinko evidence."

dependencies:
  tools:
    - type: "mcp"
      value: "klinko"
      description: "Authenticated Klinko AI market research runtime"
      transport: "streamable_http"
      url: "https://api.klinko.ai/mcp/"

policy:
  allow_implicit_invocation: true
