interface:
  display_name: "Klinko Market Research"
  short_description: "Use six core evidence-led AI market research skills"
  default_prompt: "Use $klinko-market-research to apply the right research skill and answer my market question with Klinko evidence."

dependencies:
  tools:
    - type: "mcp"
      value: "klinko"
      description: "Authenticated Klinko market intelligence runtime"
      transport: "streamable_http"
      url: "https://mcp-dev.klinko.ai/mcp/"

policy:
  allow_implicit_invocation: true
